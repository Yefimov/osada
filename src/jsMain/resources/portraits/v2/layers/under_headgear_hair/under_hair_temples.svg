<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Under-cap short hair and temples">
  <g fill="var(--hair,#4a3a2b)" stroke="var(--outline,#2b241c)" stroke-width="2.2" stroke-linejoin="round">
    <!-- The crown sits behind the hat. Its uneven lower edge remains visible below small caps,
         so a short-haired officer cannot read as bald merely because the full-hair layer is hidden. -->
