             L202,132 C193,128 187,139 179,132 C171,142 161,134 150,145
             C139,134 129,142 121,132 C113,139 107,128 98,134 Z"/>
    <path d="M86,120 C85,134 88,146 94,150 L101,146 C97,138 96,128 97,120 Z"/>
    <path d="M214,120 C215,134 212,146 206,150 L199,146 C203,138 204,128 203,120 Z"/>
  </g>
</svg>
