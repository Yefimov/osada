# OSADA — nginx front end.
#
# Today the game answers on the bare IP over plain HTTP. When a domain is bought:
#   1. point an A record at this server;
#   2. replace `server_name _;` with the domain;
#   3. run `certbot --nginx -d <domain>` — it rewrites this file to listen on 443 and redirect 80;
#   4. set OSADA_ALLOWED_ORIGINS=https://<domain> in /etc/systemd/system/osada.service.
# No client rebuild is needed: the page derives ws:// or wss:// from its own origin.

upstream osada_app {
    server 127.0.0.1:8090;
    # No `keepalive` here on purpose: a pooled upstream connection that is later handed an Upgrade
    # request drops the socket, which showed up as a WebSocket handshake failing after a few
    # successful ones. The only non-socket route through this upstream is /healthz.
}

# The canonical WebSocket switch: `Connection: upgrade` for an upgrade request, `close` otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The room server holds every match in memory on a 2 GB box shared with Foundry VTT, and a socket
# costs it far more than an HTTP hit. These caps are generous for two commanders on one connection
# each and still stop a single address from opening rooms until the heap runs out.
limit_conn_zone $binary_remote_addr zone=osada_conn:10m;
limit_req_zone $binary_remote_addr zone=osada_mp:10m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # A committed snapshot is a single large JSON message; the socket, not the body, carries it,
    # but keep the body limit generous anyway.
    client_max_body_size 16m;

    # Do not advertise the exact nginx build in responses and error pages.
    server_tokens off;

    # 24 concurrent requests per address covers a browser loading the game's many assets in
    # parallel while still bounding one client.
    limit_conn osada_conn 24;

    access_log /var/log/nginx/osada.access.log;
    error_log /var/log/nginx/osada.error.log;

    # Static game build, served straight from disk by nginx.
    root /opt/osada/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Unit art, maps and scenarios never change without a redeploy.
    location /resources/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Multiplayer room socket.
    location /mp {
        # Rate limit the handshake, not the traffic inside an established socket: a legitimate
        # player opens a handful of sockets per session, a room-code scanner opens thousands.
        limit_req zone=osada_mp burst=10 nodelay;

        proxy_pass http://osada_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A lobby can sit idle between turns; the server's own 20 s ping keeps it alive, so this is
        # only the backstop.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /healthz {
        proxy_pass http://osada_app;
        proxy_set_header Host $host;
        access_log off;
    }
}
