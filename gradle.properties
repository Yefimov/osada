kotlin.code.style=official

# Windows + non-ASCII checkout path (C:\Users\Илья\...).
#
# Gradle hands a test worker its classpath through a java @argfile, and java.exe parses argfiles in
# the OS native encoding (windows-1251 here) while the daemon writes them in its default charset.
# On JDK 18+ that default is UTF-8, so every path containing Cyrillic arrives mangled and the worker
# silently starts without the project's own classes -- ":multiplayer-server:test" then fails with
# ClassNotFoundException for every test class. Writing argfiles in the native charset makes the two
# sides agree. Drop this line if the checkout moves to an ASCII-only path, and do not carry it to a
# Linux build machine, where UTF-8 is the correct default.
org.gradle.jvmargs=-Dfile.encoding=windows-1251
